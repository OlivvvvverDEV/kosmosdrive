<!doctype html>
<html lang="es" style="position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Kosmos Drive 7.0</title>
    <meta name="description" content="kosmos drive API" />
    <meta property="og:title" content="Kosmos Drive 7.0" />
    <meta property="og:description" content="kosmos drive API" />
    <meta name="theme-color" content="#FFFFFF" id="meta-theme-color" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1017" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="meta-status-bar" />
    <meta name="apple-mobile-web-app-title" content="KosmosDrive" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('delivery-settings');
          var isDark = false;
          if (saved) {
            var parsed = JSON.parse(saved);
            isDark = parsed.theme === 'dark';
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            var metaTheme = document.getElementById('meta-theme-color');
            if (metaTheme) metaTheme.setAttribute('content', '#121217');
            var metaStatus = document.getElementById('meta-status-bar');
            if (metaStatus) metaStatus.setAttribute('content', 'black-translucent');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="position: fixed; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; overscroll-behavior-y: none; -webkit-overflow-scrolling: touch;">
    <div id="root" style="position: fixed; inset: 0; height: 100%; width: 100%; overflow: hidden;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
